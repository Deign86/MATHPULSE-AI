models:
  primary:
    id: claude-haiku-5-5
    description: Claude Haiku 5.5 fast tier — runs every task under dev and budget, and every task except RAG lessons under prod; thinking off
    max_new_tokens: 800

  rag_primary:
    id: claude-opus-5-5
    description: Claude Opus 5.5 reasoning tier — adaptive thinking; serves RAG lessons under prod, plus risk narratives when no MODEL_PROFILE is set
    max_new_tokens: 1800

  embedding:
    id: BAAI/bge-small-en-v1.5
    description: Embedding model for RAG retrieval — curriculum vectorstore ingestion and semantic search
    note: Not part of the generation pipeline. Read from EMBEDDING_MODEL env var only. Not swappable via admin panel.

  model_capabilities:
    sequential_only:
      - claude-opus-5-5
    supports_thinking:
      - claude-opus-5-5

