models:
  primary:
    id: deepseek-flash
    description: Default DeepSeek chat model — all chat tasks, quizzes, lessons, reasoning
    max_new_tokens: 800
    temperature: 0.7
    top_p: 0.9

  rag_primary:
    id: deepseek-v4-pro
    description: DeepSeek reasoner — extended reasoning for complex RAG tasks
    max_new_tokens: 1800
    temperature: 0.2
    top_p: 0.9
    enable_thinking_tasks:
      - rag_lesson
      - risk_narrative
    no_thinking_tasks:
      - chat
      - quiz_generation
      - learning_path
      - daily_insight

  embedding:
    id: BAAI/bge-small-en-v1.5
    description: Embedding model for RAG retrieval — curriculum vectorstore ingestion and semantic search
    note: Not part of the generation pipeline. Read from EMBEDDING_MODEL env var only. Not swappable via admin panel.

  model_capabilities:
    sequential_only:
      - deepseek-v4-pro
    supports_thinking:
      - deepseek-v4-pro

routing:
  task_model_map:
    chat:                  deepseek-flash
    verify_solution:       deepseek-flash
    lesson_generation:     deepseek-flash
    quiz_generation:       deepseek-flash
    practice_generation:   deepseek-flash
    learning_path:         deepseek-flash
    daily_insight:         deepseek-flash
    risk_classification:   deepseek-flash
    risk_narrative:        deepseek-v4-pro
    rag_lesson:            deepseek-v4-pro
    rag_problem:           deepseek-flash
    rag_analysis_context:  deepseek-flash

  task_fallback_model_map:
    chat:
      - deepseek-flash
    verify_solution:
      - deepseek-flash
    lesson_generation:
      - deepseek-flash
    quiz_generation:
      - deepseek-flash
    practice_generation:
      - deepseek-flash
    learning_path:
      - deepseek-flash
    daily_insight:
      - deepseek-flash
    risk_classification:
      - deepseek-flash
    risk_narrative:
      - deepseek-flash
    rag_lesson:
      - deepseek-flash
    rag_problem:
      - deepseek-flash
    rag_analysis_context:
      - deepseek-flash

  task_provider_map:
    chat:                  deepseek
    verify_solution:       deepseek
    lesson_generation:     deepseek
    quiz_generation:       deepseek
    practice_generation:   deepseek
    learning_path:         deepseek
    daily_insight:         deepseek
    risk_classification:   deepseek
    risk_narrative:        deepseek
    rag_lesson:            deepseek
    rag_problem:           deepseek
    rag_analysis_context:  deepseek