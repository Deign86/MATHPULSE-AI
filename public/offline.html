<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9956DE" />
    <title>MathPulse AI — Offline</title>
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;min-height:100%}
      body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:'Nunito',ui-sans-serif,system-ui,sans-serif;background:#f8faff;color:#0a1628}
      .card{width:min(100%,26rem);padding:2rem;border-radius:2rem;border:1px solid #dde3eb;background:#fff;box-shadow:0 24px 40px rgba(56,189,248,.12);text-align:center}
      .emoji{font-size:3rem;line-height:1}
      h1{margin:1rem 0 .5rem;font-size:1.35rem;font-weight:800}
      p{margin:0 0 1.5rem;color:#64748b;font-size:.95rem;line-height:1.5}
      button{appearance:none;border:0;cursor:pointer;padding:.75rem 1.25rem;border-radius:.9rem;background:#9956DE;color:#fff;font-weight:700;font-size:.9rem}
      button:hover{filter:brightness(1.05)}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="emoji" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>MathPulse AI needs a connection to load your dashboard and AI tutor. Check your network and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
