name: Repository CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_reason:
        description: Reason for this CI run
        required: false
        type: string
        default: manual
      requires_ci:
        description: Whether CI checks should run
        required: false
        type: boolean
        default: true
      run_frontend:
        description: Whether to run frontend checks
        required: false
        type: boolean
        default: true
      run_backend:
        description: Whether to run backend checks
        required: false
        type: boolean
        default: true
      run_functions:
        description: Whether to run Firebase Functions checks
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PYTHON_VERSION: '3.12'

jobs:
  frontend:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.requires_ci && inputs.run_frontend) }}
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test -- --run
      - name: Build production PWA
        env:
          VITE_API_URL: /api
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Validate PWA build artifacts
        run: npm run validate:pwa

      - name: Check production bundle safety
        shell: bash
        run: |
          set -euo pipefail
          if grep -RinE 'huggingface\.co/spaces/Deign86/MathPulse-AI' build \
            --include='*.js' --include='*.html' --include='*.json'; then
            echo 'Retired hosted frontend reference found in build output'
            exit 1
          fi

      - name: Upload production frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathpulse-pwa-${{ github.sha }}
          path: build
          retention-days: 7

  backend:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.requires_ci && inputs.run_backend) }}
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run backend pre-deploy checks
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python backend/pre_deploy_check.py

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest tests/ -v --tb=short

  functions:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.requires_ci && inputs.run_functions) }}
    name: Firebase Functions checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm test
