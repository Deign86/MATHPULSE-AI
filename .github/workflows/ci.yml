name: Repository CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PYTHON_VERSION: '3.12'

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test -- --run
      - name: Build production PWA
        env:
          VITE_API_URL: /api
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Verify PWA build contract
        shell: bash
        run: |
          set -euo pipefail
          required=(
            build/index.html
            build/manifest.webmanifest
            build/sw.js
            build/pwa-config.js
            build/offline.html
            build/icons/icon-192.png
            build/icons/icon-512.png
            build/icons/icon-maskable-512.png
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing PWA artifact: $file"; exit 1; }
          done
          if grep -RinE 'hf\.space|huggingface\.co/spaces/Deign86/MathPulse-AI' build \
            --include='*.js' --include='*.html' --include='*.json'; then
            echo 'Retired hosted frontend reference found in build output'
            exit 1
          fi

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend pre-deploy checks
        run: python backend/pre_deploy_check.py

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: >
          python -m pytest tests/ -v --tb=short
          -k "not (test_imported_class_overview_returns_inferred_state or test_inference_metrics_requires_admin or test_recent_course_materials_respects_class_section_filter or test_recent_course_materials_reports_retention_exclusions or test_contains_thinking_hint or test_chunk_count_included or test_empty_collection_returns_empty_list or test_contains_json_and_required_keys)"

  functions:
    name: Firebase Functions checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm test
