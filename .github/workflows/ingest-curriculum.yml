name: Remote RAG Curriculum Ingestion

on:
  workflow_dispatch:
    inputs:
      force_reindex:
        description: 'Force reindex of all documents'
        required: false
        type: boolean
        default: true
      upload_to_firebase:
        description: 'Upload generated vectorstore to Firebase Storage'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rag-curriculum-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Run Remote Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install chromadb sentence-transformers langchain-text-splitters torch liteparse

      - name: Run curriculum ingestion from Firebase Storage
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || 'BAAI/bge-small-en-v1.5' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_reindex }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m backend.scripts.ingest_from_storage $FORCE_FLAG

      - name: Upload vectorstore to Firebase Storage
        if: ${{ inputs.upload_to_firebase }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/upload_vectorstore.py
          python -m backend.scripts.upload_vectorstore_to_firebase
