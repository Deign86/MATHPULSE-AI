      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MathPulse AI",
        "url": "https://mathpulse-ai-2026.web.app/",

        "description": "AI-powered math tutoring platform for Filipino Senior High School STEM students with adaptive learning paths and teacher analytics.",
        "inLanguage": "en-PH"
      }
      </script>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
      <title>MathPulse AI</title>
      <style>
        /* ── Pre-React static loader ──────────────────────────────────────────
           Shown from first browser paint until React mounts.
           Visually matches MathPulseLoader (React component) exactly so the
           transition is seamless. Removed automatically when React replaces #root.
        ──────────────────────────────────────────────────────────────────────── */
        *,*::before,*::after { box-sizing: border-box }
        html, body { margin: 0; min-height: 100% }
        body {
          min-height: 100vh;
          font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif;
          background: #f8faff;
          color: #0a1628;
        }

        /* Keyframes --------------------------------------------------------- */
        @keyframes pp-head-sway {
          0%,100% { transform: rotate(-3deg) translateY(0); }
          50%      { transform: rotate(3deg) translateY(-3px); }
        }
        @keyframes pp-horn-left {
          0%,100% { transform: rotate(-5deg); }
          50%      { transform: rotate(5deg); }
        }
        @keyframes pp-horn-right {
          0%,100% { transform: rotate(5deg); }
          50%      { transform: rotate(-5deg); }
        }
        @keyframes pp-glow-pulse {
          0%,100% { transform: scale(0.95); opacity: 0.5; }
          50%      { transform: scale(1.1);  opacity: 0.9; }
        }
        @keyframes pp-glyph-float {
          0%,100% { transform: translateY(-4px); opacity: 0.2; }
          50%      { transform: translateY(4px);  opacity: 0.45; }
        }
        @keyframes pp-shimmer {
          from { transform: translateX(-110%); }
          to   { transform: translateX(210%);  }
        }
        @media (prefers-reduced-motion: reduce) {
          .pp-head-group, .pp-horn-l, .pp-horn-r, .pp-glow,
          .pp-glyph, .pp-bar { animation: none !important; }
        }

        /* Full-screen container --------------------------------------------- */
        #pp-static-loader {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0;
          padding: 1.5rem;
          background: rgba(248, 250, 255, 0.98);
          user-select: none;
          overflow: hidden;
        }

        /* Floating ambient math glyphs -------------------------------------- */
        .pp-glyph {
          position: absolute;
          font-weight: 900;
          font-size: clamp(0.875rem, 2.5vw, 1.125rem);
          color: rgba(56,189,248,0.22);
          animation: pp-glyph-float 3.5s ease-in-out infinite;
          pointer-events: none;
        }
        .pp-glyph:nth-child(1) { top:15%; left:18%;  animation-delay: 0s   }
        .pp-glyph:nth-child(2) { top:22%; right:20%; animation-delay: 0.6s }
        .pp-glyph:nth-child(3) { bottom:26%; left:22%;  animation-delay: 1.2s }
        .pp-glyph:nth-child(4) { bottom:24%; right:19%; animation-delay: 1.8s }
        .pp-glyph:nth-child(5) { top:48%; left:12%;  animation-delay: 2.4s }

        /* Mascot badge ------------------------------------------------------ */
        .pp-badge-wrap {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 1.5rem;
        }

        /* Soft glow ring */
        .pp-glow {
          position: absolute;
          width: clamp(9rem, 22vw, 11rem);
          height: clamp(9rem, 22vw, 11rem);
          border-radius: 50%;
          background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(99,102,241,0.15) 50%, rgba(251,113,133,0.18) 100%);
          filter: blur(20px);
          animation: pp-glow-pulse 3s ease-in-out infinite;
        }

        /* White rounded podium frame */
        .pp-frame {
          position: relative;
          width: clamp(7rem, 18vw, 8rem);
          height: clamp(7rem, 18vw, 8rem);
          border-radius: 1.5rem;
          background: rgba(255,255,255,0.92);
          border: 2px solid rgba(224,242,254,0.9);
          box-shadow: 0 12px 30px rgba(15,23,42,0.08);
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        }
        /* Inner top glow */
        .pp-frame::before {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(to bottom, rgba(240,249,255,0.5), transparent);
          pointer-events: none;
        }

        /* Animated head group (contains all mascot layers) */
        .pp-head-group {
          position: relative;
          width: clamp(5.5rem, 14vw, 7rem);
          height: clamp(5.5rem, 14vw, 7rem);
          transform-origin: 50% 84%;
          animation: pp-head-sway 3.6s ease-in-out infinite;
        }
        .pp-head-group img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
        .pp-horn-l {
          transform-origin: 17% 35%;
          animation: pp-horn-left 3.2s ease-in-out infinite;
          z-index: 0;
        }
        .pp-horn-r {
          transform-origin: 82% 35%;
          animation: pp-horn-right 3.2s ease-in-out infinite;
          z-index: 0;
        }
        .pp-head-base { z-index: 1; }
        .pp-eyes      { z-index: 2; }

        /* Text copy --------------------------------------------------------- */
        .pp-copy {
          text-align: center;
          max-width: min(90vw, 28rem);
          padding: 0 1rem;
          margin-bottom: 1.25rem;
        }
        .pp-title {
          margin: 0 0 0.375rem;
          font-size: clamp(0.8125rem, 2.2vw, 1rem);
          font-weight: 800;
          color: #1e293b;
          letter-spacing: -0.01em;
          line-height: 1.3;
        }
        .pp-subtitle {
          margin: 0;
          font-size: clamp(0.6875rem, 1.8vw, 0.875rem);
          font-weight: 600;
          color: #64748b;
          line-height: 1.5;
        }

        /* Gradient shimmer progress bar ------------------------------------- */
        .pp-track {
          width: clamp(13rem, 55vw, 16rem);
          height: 0.5rem;
          background: rgba(226,232,240,0.8);
          border-radius: 999px;
          overflow: hidden;
          box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
        }
        .pp-bar {
          height: 100%;
          width: 55%;
          border-radius: 999px;
          background: linear-gradient(to right, #0ea5e9, #6366f1, #f87171);
          animation: pp-shimmer 1.4s ease-in-out infinite;
        }
      </style>
    </head>

    <body>
      <div id="root">
        <!-- Pre-React loader: visible from first HTML paint, wiped when React mounts -->
        <div
          id="pp-static-loader"
          role="status"
          aria-live="polite"
          aria-busy="true"
          aria-label="MathPulse AI is loading"
        >
          <!-- Floating ambient math glyphs -->
          <span class="pp-glyph" aria-hidden="true">+</span>
          <span class="pp-glyph" aria-hidden="true">π</span>
          <span class="pp-glyph" aria-hidden="true">×</span>
          <span class="pp-glyph" aria-hidden="true">√</span>
          <span class="pp-glyph" aria-hidden="true">∑</span>

          <!-- Mascot badge -->
          <div class="pp-badge-wrap">
            <div class="pp-glow" aria-hidden="true"></div>
            <div class="pp-frame">
              <div class="pp-head-group" aria-hidden="true">
                <img src="/avatar/loader/loader_left_horn.png"  class="pp-horn-l"    alt="" />
                <img src="/avatar/loader/loader_right_horn.png" class="pp-horn-r"    alt="" />
                <img src="/avatar/loader/loader_head_base.png"  class="pp-head-base" alt="" />
                <img src="/avatar/loader/loader_eyes.png"       class="pp-eyes"      alt="" />
              </div>
            </div>
          </div>

          <!-- Text -->
          <div class="pp-copy">
            <h2 class="pp-title">Loading MathPulse AI…</h2>
            <p class="pp-subtitle">Preparing your personalized math experience.</p>
          </div>

          <!-- Shimmer progress bar -->
          <div class="pp-track" aria-hidden="true">
            <div class="pp-bar"></div>
          </div>
        </div>
      </div>
       <div id="modal-root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
